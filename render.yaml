# Render Blueprint — https://render.com/docs/blueprint-spec
# Deploy: Dashboard → New → Blueprint → connect this repo

services:
  - type: web
    name: campuscommute-api
    runtime: node
    plan: free
    buildCommand: npm install && npm run build -w backend
    startCommand: npm run deploy -w backend
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: campuscommute-db
          property: connectionString
      - key: JWT_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: ENCRYPTION_KEY
        sync: false
      - key: CORS_ORIGIN
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: ALLOW_DEV_OTP
        value: "false"
      - key: ALLOWED_EMAIL_DOMAIN
        value: gim.ac.in

databases:
  - name: campuscommute-db
    plan: free
    databaseName: campuscommute
    user: campuscommute
